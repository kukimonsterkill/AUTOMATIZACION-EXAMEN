name: CD Pipeline - Blue/Green Deployment & Rollback

on:
  push:
    branches: [ "master", "develop" ]

jobs:
  deploy-and-rollback:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Ejecutar Pruebas de Aceptación (UAT)
        run: mvn test -Dtest=CalculadoraTest

      - name: Despliegue a ambiente Green (Simulado)
        run: |
          echo "Iniciando despliegue en ambiente Green..."
          echo "Versión desplegada con éxito."

      - name: Pruebas de Humo (Smoke Tests)
        run: |
          echo "Ejecutando validaciones post-despliegue en Green..."

      - name: Conmutar Tráfico a Green (Blue -> Green)
        if: success()
        run: |
          echo "¡Despliegue exitoso! Redirigiendo tráfico al ambiente Green."

      - name: Rollback Automático en caso de fallo (Green -> Blue)
        if: failure()
        run: |
          echo "¡Alerta! Fallo detectado en el ambiente Green."
          echo "Ejecutando Rollback inmediato de regreso al ambiente Blue seguro..."
          echo "Rollback completado con éxito."