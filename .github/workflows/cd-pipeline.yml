name: CD Pipeline - Blue/Green Deployment & Rollback
on:
  push:
    branches: [ "master", "develop" ]
jobs:
  deploy-and-rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Ejecutar Pruebas de Aceptación (UAT)
        run: mvn test -Dtest=CalculadoraTest

      - name: Despliegue a ambiente Green (Staging)
        run: |
          echo "Desplegando artefactos en servidor Green..."
          # Aquí iría el comando real: scp target/app.jar user@green-server:/opt/app/

      - name: Health Check (Smoke Tests en Green)
        id: health_check
        run: |
          echo "Verificando estado del servicio HTTP 200 OK..."
          # Simulación de respuesta del servidor (0 = Éxito, 1 = Fallo)
          exit 0 

      - name: Conmutar Tráfico a Green (Switch Router)
        if: success()
        run: |
          echo "Health check aprobado. Redirigiendo tráfico 100% al ambiente Green."

      - name: Rollback Automático (Green -> Blue)
        if: failure()
        run: |
          echo "Fallo detectado en Health Check. Iniciando protocolo de reversión."
          echo "Restaurando tráfico al ambiente Blue (Estable)..."
          echo "Rollback completado. Sistema operando de forma segura."