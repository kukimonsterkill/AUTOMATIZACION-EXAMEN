name: CI Pipeline - Build & Test

# Se ejecuta al hacer push o pull request en master o develop
on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compilar el proyecto (Build)
        run: mvn clean compile

      - name: Ejecutar pruebas unitarias e integración
        run: mvn test